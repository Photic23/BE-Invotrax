image: node:latest  # Includes npm

stages:
  - deploy

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip  # Ensure Python is installed
    - pip3 install -r requirements.txt  # Install Django dependencies
  script:
    - npm install -g vercel  # Install Vercel CLI
    - vercel --prod --token=$VERCEL_TOKEN  # Deploy to Vercel
  only:
    - dev  # Deploy only from the 'dev' branch
