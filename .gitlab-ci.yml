image: python:3.9

stages:
  - build
  - deploy

variables:
  APP_DIR: "/home/propenchill/propenchill"
  VENV_PATH: "/home/propenchill/propenchill/venv"

build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y libpq-dev  # PostgreSQL client dev files
  script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - staticfiles/
      - .
    expire_in: 1 hour
  only:
    - dev

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/propenchill.pem  # Use same filename as locally
    - chmod 600 ~/.ssh/propenchill.pem
    - echo -e "Host $LIGHTHOUSE_HOST\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
  script:
    # Use the identical syntax to what works for you locally
    - ssh -i ~/.ssh/propenchill.pem $TENCENT_USER@$LIGHTHOUSE_HOST "mkdir -p $APP_DIR"
    
    # For all subsequent commands, use the same -i flag
    - scp -i ~/.ssh/propenchill.pem -r ./* $TENCENT_USER@$LIGHTHOUSE_HOST:$APP_DIR/
    
    # And for the rest of your ssh commands
    - ssh -i ~/.ssh/propenchill.pem $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && python3 -m venv $VENV_PATH || true"
    - ssh -i ~/.ssh/propenchill.pem $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && pip install -r requirements.txt"
    # etc.
  only:
    - dev
