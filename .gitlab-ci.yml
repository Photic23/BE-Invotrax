image: python:3.9

stages:
  - build
  - deploy

variables:
  APP_DIR: "/home/propenchill/propenchill"
  VENV_PATH: "/home/propenchill/propenchill/venv"
  DB_NAME: "propenchill"  # Replace with your actual database name
  DB_USER: "propenchill"  # Replace with your Django database user

build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y libpq-dev  # PostgreSQL client dev files
  script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - staticfiles/
      - .
    expire_in: 1 hour
  only:
    - dev

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - apt-get install -y sshpass  # Ensure sshpass is installed
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host $LIGHTHOUSE_HOST\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
  script:
    # Create directory structure if it doesn't exist
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "mkdir -p $APP_DIR"
    
    # Deploy code to server
    - sshpass -p "123ytrewq" scp -r ./* propenchill@$LIGHTHOUSE_HOST:$APP_DIR/
    
    # Setup and activate virtual environment
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "cd $APP_DIR && python3 -m venv $VENV_PATH || true"
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && pip install -r requirements.txt"
    
    # Fix database permissions
    - |
      sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "sudo -u postgres psql -c \"
      GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};
      \\c ${DB_NAME};
      GRANT USAGE ON SCHEMA public TO ${DB_USER};
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ${DB_USER};
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ${DB_USER};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO ${DB_USER};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO ${DB_USER};
      \""

    # Run Django commands
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && python manage.py migrate --noinput"
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && python manage.py collectstatic --noinput"
    
    # Restart services
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "sudo systemctl restart gunicorn"
    - sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "sudo systemctl restart nginx"
  only:
    - dev
