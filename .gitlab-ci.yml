image: python:3.9

stages:
  - build
  - deploy

variables:
  APP_DIR: "/home/ubuntu/propenchill"
  VENV_PATH: "/home/ubuntu/propenchill/venv"

build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y libpq-dev  # PostgreSQL client dev files
  script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - staticfiles/
      - .
    expire_in: 1 hour
  only:
    - dev

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host $LIGHTHOUSE_HOST\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
  script:
    # Create directory structure if it doesn't exist
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "mkdir -p $APP_DIR"
    
    # Deploy code to server
    - scp -r ./* $TENCENT_USER@$LIGHTHOUSE_HOST:$APP_DIR/
    
    # Setup and activate virtual environment
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && python3 -m venv $VENV_PATH || true"
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && pip install -r requirements.txt"
    
    # Run Django commands
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && python manage.py migrate --noinput"
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "cd $APP_DIR && source $VENV_PATH/bin/activate && python manage.py collectstatic --noinput"
    
    # Restart services
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "sudo systemctl restart gunicorn"
    - ssh $TENCENT_USER@$LIGHTHOUSE_HOST "sudo systemctl restart nginx"
  only:
    - dev
