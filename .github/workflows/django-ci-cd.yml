name: Django CI/CD Workflow

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django checks
      run: |
        python manage.py collectstatic --noinput
        python manage.py check --deploy
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: django-app
        path: |
          staticfiles/
          .
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: django-app
    
    - name: Deploy to server
      run: |
        # Install SSH and sshpass
        sudo apt-get update
        sudo apt-get install -y openssh-client sshpass
        
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo -e "Host $LIGHTHOUSE_HOST\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
        
        # Deploy code
        sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "mkdir -p /home/propenchill/propenchill"
        sshpass -p "123ytrewq" scp -r ./* propenchill@$LIGHTHOUSE_HOST:/home/propenchill/propenchill/
        
        # Setup virtual environment and dependencies
        sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "
          cd /home/propenchill/propenchill && 
          python3 -m venv venv || true && 
          source venv/bin/activate && 
          pip install -r requirements.txt && 
          python manage.py migrate --noinput && 
          python manage.py collectstatic --noinput
        "
        
        # Restart services
        sshpass -p "123ytrewq" ssh propenchill@$LIGHTHOUSE_HOST "
          echo '123ytrewq' | sudo -S systemctl restart gunicorn &&
          echo '123ytrewq' | sudo -S systemctl restart nginx
        "